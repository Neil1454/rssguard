name: Build 72 source publisher

on:
  push:
    branches: [feature/torrent-automation]
    paths: [.github/workflows/build72-bootstrap.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/torrent-automation
          fetch-depth: 0
      - name: Apply reviewed Build 72 source
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/build72.patch
          git apply /tmp/build72.patch
          rm .github/workflows/build72-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Build 72: fix rTorrent automation and settings controls'
          git push origin HEAD:feature/torrent-automation
