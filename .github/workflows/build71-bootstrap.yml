name: Build 71 temporary publisher

on:
  push:
    branches:
      - feature/torrent-automation
    paths:
      - .github/workflows/build71-bootstrap.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/torrent-automation
          fetch-depth: 0
      - name: Apply exact Build 71 patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/build71.patch
          git apply --check /tmp/build71.patch
          git apply /tmp/build71.patch
          rm .github/workflows/build71-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rework torrent cleanup decisions and rTorrent deletion"
          git push origin HEAD:feature/torrent-automation
      - name: Start Windows Build 71
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run torrent-windows-portable.yml --ref feature/torrent-automation
