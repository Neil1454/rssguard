name: Bug Report
description: Report an RSS Guard or torrent-integration problem
title: '[BUG]: '
labels: Type-Defect
assignees: ''
body:
  - type: markdown
    attributes:
      value: |
        For torrent-integration reports, use the latest Neil1454 Windows test build and identify its build number.
        Never include passwords, tokens, cookies, private feed contents, tracker passkeys or private seedbox addresses.

        Almost every bug report needs the RSS Guard DEBUG LOG.
        Please attach it unless you are absolutely sure it is not relevant.

        How to create the debug log is described here:
        https://rssguard.readthedocs.io/en/stable/contrib/bugs.html#debug-log

        If RSS Guard crashes, closes unexpectedly, or disappears, please also provide a crash dump file.
        How to create a crash dump on Windows with ProcDump is described here:
        https://rssguard.readthedocs.io/en/stable/contrib/bugs.html#crash-dump-on-windows

        Also, only report bugs after testing RSS Guard behavior in LATEST version you can get your hands on. I can understand that maybe your Linux distribution ships RSS Guard which is one or two versions behind upstream but I will NOT fix bugs reported against years old codebase.

        Please, RESPECT this template. You might be interested in reading [www.chiark.greenend.org.uk](http://www.chiark.greenend.org.uk/~sgtatham/bugs.html).
  - type: textarea
    attributes:
      label: Fork build and commit
      description: For example, Build 55 and the short commit shown under Help > About RSS Guard.
      placeholder: Build 55 / commit 81157cf6
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Affected area
      options:
        - Torrent client configuration or connection
        - Manual torrent sending
        - Notification torrent actions
        - Torrent automation routing
        - Retry or failover
        - Safe cleanup
        - Proxy or network
        - Theme or user interface
        - General RSS Guard behaviour
    validations:
      required: true
  - type: textarea
    attributes:
      label: Torrent-client environment
      description: If applicable, give the client type/version, local or remote hosting, reverse proxy, redacted URL shape, and whether Use RSS Guard proxy is enabled.
      placeholder: |
        Client and version:
        Local/remote/reverse proxy:
        Redacted URL shape:
        RSS Guard proxy enabled:
  - type: textarea
    attributes:
      label: Brief description of the issue
      description: Write your description here.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce the bug?
      placeholder: |
        1. (First Step)
        2. (Second Step)
        3. (etc.)
    validations:
      required: true
  - type: textarea
    attributes:
      label: What was the expected result?
      description: Write expected results of above reproduction steps here.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What actually happened?
      description: Write the actual result here.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Debug log
      description: Paste the debug log contents here, or attach the log file. This is needed for almost every bug report. See https://rssguard.readthedocs.io/en/stable/contrib/bugs.html#debug-log.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Crash dump
      description: If RSS Guard crashed, attach a dump file or provide a link to it. If RSS Guard did not crash, write "RSS Guard did not crash". See https://rssguard.readthedocs.io/en/stable/contrib/bugs.html#crash-dump-on-windows.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Operating system and version
      value: |
        * OS:
        * RSS Guard version:
    validations:
      required: true
